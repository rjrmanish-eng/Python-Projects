<!DOCTYPE html>
<html>
<head>
    <title>PDF Merger</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background: #f4f4f4;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 0px 10px gray;
        }
        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Upload PDFs to Merge</h2>
    <form action="/merge" method="post" enctype="multipart/form-data">
        <input type="file" name="pdfs" multiple required><br><br>
        <button type="submit">Merge PDFs</button>
    </form>
</div>

</body>
</html>
